<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestiary Full Scroll Fix</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  /* БАЗОВЫЕ НАСТРОЙКИ */
  html, body {
    margin: 0;
    padding: 0;
    background-color: #121212;
    color: #ffffff;
    font-family: "Comic Sans MS", "Comic Sans", cursive, sans-serif;
    /* Разрешаем скролл везде */
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* ШАПКА - прилипает к верху */
  .nav-header {
    background: #1a1a1a;
    border-bottom: 1px solid #333;
    position: sticky;
    top: 0;
    z-index: 1000;
    width: 100%;
  }

  .dropdown-btn {
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    font-weight: bold;
  }

  /* СПИСОК МОБОВ */
  #mob-list {
    display: none;
    max-height: 300px;
    overflow-y: auto;
    background: #1a1a1a;
    border-bottom: 2px solid #333;
  }
  .open #mob-list { display: block; }

  .mob-item {
    padding: 15px 20px;
    border-top: 1px solid #2a2a2a;
    display: flex;
    align-items: center;
    font-size: 14px;
    color: #ccc;
  }

  .add-new-btn {
    padding: 15px;
    text-align: center;
    color: #ffffff;
    background: #222;
    font-weight: bold;
    cursor: pointer;
  }

  /* КОНТЕНТНАЯ ОБЛАСТЬ */
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    padding-bottom: 50px; /* Чтобы кнопки не перекрывали низ */
  }

  #capture-area {
    background-color: #121212;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    box-sizing: border-box;
  }

  #photo-preview {
    width: 90vw;
    max-width: 320px;
    height: 90vw;
    max-height: 320px;
    object-fit: cover;
    border-radius: 20px;
    background: #1a1a1a;
    border: 2px solid #333;
    margin-bottom: 20px;
  }

  #mobName {
    font-family: inherit;
    width: 90%;
    max-width: 400px;
    background: transparent;
    border: none;
    border-bottom: 2px solid #333;
    color: white;
    font-size: 24px;
    text-align: center;
    margin-bottom: 20px;
    padding: 10px;
    outline: none;
  }

  #mobDesc {
    font-family: inherit;
    width: 90%;
    max-width: 500px;
    background: #1a1a1a;
    border: 2px solid #333;
    border-radius: 15px;
    color: #ddd;
    padding: 15px;
    font-size: 16px;
    resize: none;
    outline: none;
    box-sizing: border-box;
    line-height: 1.5;
    /* Текстовое поле будет расти само */
    min-height: 150px;
    overflow: hidden;
  }

  /* КНОПКИ ВНИЗУ */
  .controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 20px;
    width: 100%;
    max-width: 500px;
    box-sizing: border-box;
  }

  .btn {
    flex: 1;
    height: 60px;
    border-radius: 15px;
    border: 2px solid #444;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    background: #1a1a1a;
    color: #fff;
    text-transform: uppercase;
  }

  .mini-thumb { 
    width: 30px; height: 30px; border-radius: 6px; 
    object-fit: cover; margin-right: 15px; background: #333;
  }
</style>
</head>
<body>

<div class="nav-header" id="navHeader">
  <div class="dropdown-btn" onclick="toggleMenu()">
    <span id="headerTitle">БЕСТИАРИЙ</span>
    <span>▼</span>
  </div>
  <div id="mob-list">
    <div id="items-anchor"></div>
    <div class="add-new-btn" onclick="createNew()">+ НОВАЯ ЗАПИСЬ</div>
  </div>
</div>

<div class="container">
  <div id="capture-area">
    <img id="photo-preview" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" onclick="document.getElementById('fileInput').click()">
    <input type="file" id="fileInput" accept="image/*" onchange="handleImg(event)" style="display:none">

    <input type="text" id="mobName" placeholder="НАИМЕНОВАНИЕ..." oninput="save()">
    <textarea id="mobDesc" placeholder="ХАРАКТЕРИСТИКА..." oninput="save(); autoHeight(this)"></textarea>
  </div>

  <div class="controls">
    <button class="btn" onclick="exportImg()">СОХРАНИТЬ</button>
    <button class="btn" onclick="removeFile()">УДАЛИТЬ</button>
  </div>
</div>

<script>
  let dataSet = [];
  let current = 0;
  const KEY = 'BESTIARY_SCROLL_V15';
  const BLANK = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";

  window.onload = () => {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      try { dataSet = JSON.parse(raw); } catch(e) { dataSet = []; }
    }
    if (!dataSet || dataSet.length === 0) dataSet = [{ name: "", desc: "", img: "" }];
    
    const savedIdx = localStorage.getItem('cur_idx');
    current = (savedIdx && savedIdx < dataSet.length) ? parseInt(savedIdx) : 0;
    
    load();
    updateMenu();
  };

  function autoHeight(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  function load() {
    const item = dataSet[current];
    document.getElementById('mobName').value = item.name || "";
    document.getElementById('mobDesc').value = item.desc || "";
    document.getElementById('photo-preview').src = item.img || BLANK;
    document.getElementById('headerTitle').textContent = item.name.trim() || "БЕСТИАРИЙ";
    localStorage.setItem('cur_idx', current);
    autoHeight(document.getElementById('mobDesc'));
  }

  function save() {
    dataSet[current].name = document.getElementById('mobName').value;
    dataSet[current].desc = document.getElementById('mobDesc').value;
    document.getElementById('headerTitle').textContent = dataSet[current].name.trim() || "БЕСТИАРИЙ";
    localStorage.setItem(KEY, JSON.stringify(dataSet));
    updateMenu();
  }

  function updateMenu() {
    const anchor = document.getElementById('items-anchor');
    anchor.innerHTML = '';
    dataSet.forEach((item, i) => {
      const div = document.createElement('div');
      div.className = 'mob-item';
      div.onclick = () => { current = i; load(); toggleMenu(); window.scrollTo(0,0); };
      div.innerHTML = `<img src="${item.img || BLANK}" class="mini-thumb"> <span>${item.name || '(Пусто)'}</span>`;
      anchor.appendChild(div);
    });
  }

  function handleImg(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const max = 600;
        let w = img.width, h = img.height;
        if (w > h) { if (w > max) { h *= max/w; w = max; } }
        else { if (h > max) { w *= max/h; h = max; } }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        dataSet[current].img = canvas.toDataURL('image/jpeg', 0.7);
        document.getElementById('photo-preview').src = dataSet[current].img;
        save();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function createNew() {
    dataSet.push({ name: "", desc: "", img: "" });
    current = dataSet.length - 1;
    save();
    load();
    toggleMenu();
    window.scrollTo(0,0);
  }

  function removeFile() {
    if (confirm("УДАЛИТЬ ЭТОТ ФАЙЛ?")) {
      dataSet.splice(current, 1);
      if (dataSet.length === 0) dataSet = [{ name: "", desc: "", img: "" }];
      current = 0;
      localStorage.setItem(KEY, JSON.stringify(dataSet));
      load();
      updateMenu();
    }
  }

  function toggleMenu() { document.getElementById('navHeader').classList.toggle('open'); }

  async function exportImg() {
    const area = document.getElementById('capture-area');
    html2canvas(area, { backgroundColor: "#121212", scale: 2, useCORS: true }).then(canvas => {
      const link = document.createElement('a');
      link.download = `${dataSet[current].name || 'creature'}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    });
  }
</script>
</body>
</html>
