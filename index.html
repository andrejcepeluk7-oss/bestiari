<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestiary Natural Scroll</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  /* ПОЛНАЯ СВОБОДА СКРОЛЛА */
  html, body {
    margin: 0;
    padding: 0;
    background-color: #121212;
    color: #ffffff;
    font-family: "Comic Sans MS", cursive, sans-serif;
    /* Убираем любые ограничения по высоте */
    height: auto !important;
    min-height: 100%;
    /* Включаем стандартное поведение прокрутки */
    overflow-x: hidden;
    overflow-y: visible !important;
    -webkit-overflow-scrolling: touch;
    touch-action: auto !important;
  }

  /* ШАПКА */
  .nav-header {
    background: #1a1a1a;
    border-bottom: 2px solid #333;
    width: 100%;
    /* Sticky не блокирует скролл так, как fixed */
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .dropdown-btn {
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    font-weight: bold;
  }

  #mob-list {
    display: none;
    max-height: 300px;
    overflow-y: auto;
    background: #1a1a1a;
    border-bottom: 2px solid #444;
  }

  .mob-item {
    padding: 15px 20px;
    border-top: 1px solid #333;
    display: flex;
    align-items: center;
    cursor: pointer;
  }

  .add-new-btn {
    padding: 15px;
    text-align: center;
    background: #222;
    color: #4caf50;
    font-weight: bold;
    cursor: pointer;
  }

  /* КОНТЕНТ */
  .main-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    padding-bottom: 60px;
  }

  #capture-area {
    background-color: #121212;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    box-sizing: border-box;
  }

  #photo-preview {
    width: 280px;
    height: 280px;
    object-fit: cover;
    border-radius: 20px;
    background: #1a1a1a;
    border: 2px solid #333;
    margin-bottom: 20px;
  }

  #mobName {
    font-family: inherit;
    width: 90%;
    max-width: 400px;
    background: transparent;
    border: none;
    border-bottom: 2px solid #444;
    color: white;
    font-size: 24px;
    text-align: center;
    margin-bottom: 20px;
    padding: 10px;
    outline: none;
  }

  #mobDesc {
    font-family: inherit;
    width: 90%;
    max-width: 500px;
    background: #1a1a1a;
    border: 2px solid #333;
    border-radius: 15px;
    color: #ddd;
    padding: 15px;
    font-size: 16px;
    line-height: 1.5;
    min-height: 150px;
    resize: none;
    outline: none;
    /* Текстовое поле будет расти, чтобы не скроллить внутри него */
    overflow: hidden;
  }

  /* КНОПКИ */
  .controls {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 90%;
    max-width: 400px;
    margin-top: 20px;
  }

  .btn {
    width: 100%;
    padding: 18px;
    border-radius: 12px;
    border: 2px solid #444;
    background: #1a1a1a;
    color: white;
    font-size: 16px;
    font-weight: bold;
    text-transform: uppercase;
    cursor: pointer;
  }

  .mini-thumb { 
    width: 35px; height: 35px; border-radius: 6px; 
    object-fit: cover; margin-right: 15px; background: #333;
  }
</style>
</head>
<body>

<div class="nav-header">
  <div class="dropdown-btn" onclick="toggleMenu()">
    <span id="currentName">БЕСТИАРИЙ</span>
    <span>▼</span>
  </div>
  <div id="mob-list">
    <div id="list-items"></div>
    <div class="add-new-btn" onclick="createNew()">+ НОВАЯ ЗАПИСЬ</div>
  </div>
</div>

<div class="main-wrap">
  <div id="capture-area">
    <img id="photo-preview" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" onclick="document.getElementById('fileIn').click()">
    <input type="file" id="fileIn" accept="image/*" style="display:none" onchange="upload(event)">

    <input type="text" id="mobName" placeholder="НАЗВАНИЕ..." oninput="save()">
    <textarea id="mobDesc" placeholder="ОПИСАНИЕ..." oninput="save(); fixHeight(this)"></textarea>
  </div>

  <div class="controls">
    <button class="btn" style="border-color: #444;" onclick="downloadPng()">СКАЧАТЬ PNG</button>
    <button class="btn" style="border-color: #600;" onclick="deleteFile()">УДАЛИТЬ ФАЙЛ</button>
  </div>
</div>

<script>
  let db = [];
  let current = 0;
  const DB_KEY = 'BESTIARY_FREE_SCROLL_V17';
  const BLANK = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";

  window.onload = () => {
    const saved = localStorage.getItem(DB_KEY);
    if (saved) db = JSON.parse(saved);
    if (!db || db.length === 0) db = [{name: "", desc: "", img: ""}];
    
    current = parseInt(localStorage.getItem('active_idx') || 0);
    if (current >= db.length) current = 0;
    
    render();
    buildMenu();
  };

  function fixHeight(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  function render() {
    const item = db[current];
    document.getElementById('mobName').value = item.name || "";
    document.getElementById('mobDesc').value = item.desc || "";
    document.getElementById('photo-preview').src = item.img || BLANK;
    document.getElementById('currentName').textContent = item.name || "БЕСТИАРИЙ";
    fixHeight(document.getElementById('mobDesc'));
  }

  function save() {
    db[current].name = document.getElementById('mobName').value;
    db[current].desc = document.getElementById('mobDesc').value;
    document.getElementById('currentName').textContent = db[current].name || "БЕСТИАРИЙ";
    localStorage.setItem(DB_KEY, JSON.stringify(db));
    localStorage.setItem('active_idx', current);
    buildMenu();
  }

  function buildMenu() {
    const list = document.getElementById('list-items');
    list.innerHTML = '';
    db.forEach((item, i) => {
      const d = document.createElement('div');
      d.className = 'mob-item';
      d.onclick = () => { current = i; render(); toggleMenu(); window.scrollTo(0,0); };
      d.innerHTML = `<img src="${item.img || BLANK}" class="mini-thumb"> <span>${item.name || '(Пусто)'}</span>`;
      list.appendChild(d);
    });
  }

  function upload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const cvs = document.createElement('canvas');
        const max = 600;
        let w = img.width, h = img.height;
        if (w > h) { if (w > max) { h *= max/w; w = max; } }
        else { if (h > max) { w *= max/h; h = max; } }
        cvs.width = w; cvs.height = h;
        cvs.getContext('2d').drawImage(img, 0, 0, w, h);
        db[current].img = cvs.toDataURL('image/jpeg', 0.7);
        document.getElementById('photo-preview').src = db[current].img;
        save();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function createNew() {
    db.push({name: "", desc: "", img: ""});
    current = db.length - 1;
    save();
    render();
    toggleMenu();
  }

  function deleteFile() {
    if (confirm("ТОЧНО УДАЛИТЬ?")) {
      db.splice(current, 1);
      if (db.length === 0) db = [{name: "", desc: "", img: ""}];
      current = 0;
      save();
      render();
    }
  }

  function toggleMenu() {
    const m = document.getElementById('mob-list');
    m.style.display = (m.style.display === 'block') ? 'none' : 'block';
  }

  function downloadPng() {
    const area = document.getElementById('capture-area');
    html2canvas(area, { backgroundColor: "#121212", scale: 2 }).then(canvas => {
      const link = document.createElement('a');
      link.download = (db[current].name || 'creature') + '.png';
      link.href = canvas.toDataURL();
      link.click();
    });
  }
</script>
</body>
</html>
