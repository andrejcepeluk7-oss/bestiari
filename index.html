<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestiary Independent Files</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  body {
    font-family: "Comic Sans MS", "Comic Sans", cursive, sans-serif;
    background-color: #121212;
    color: #ffffff;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    /* ИСПРАВЛЕНО: убрали блокировку высоты и скрытие скролла */
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
  }

  /* ШАПКА */
  .nav-header { 
    background: #1a1a1a; 
    border-bottom: 1px solid #333; 
    z-index: 1000;
    position: sticky; /* Чтобы шапка всегда была сверху при прокрутке */
    top: 0;
  }
  .dropdown-btn { padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: bold; }
  #mob-list { display: none; max-height: 250px; overflow-y: auto; background: #1a1a1a; border-bottom: 2px solid #333; }
  .open #mob-list { display: block; }

  .mob-item {
    padding: 12px 20px;
    border-top: 1px solid #2a2a2a;
    display: flex;
    align-items: center;
    font-size: 14px;
    color: #ccc;
    cursor: pointer;
  }

  .add-new-btn {
    padding: 15px;
    text-align: center;
    color: #ffffff;
    background: #282828;
    font-weight: bold;
    cursor: pointer;
    border-top: 1px solid #444;
  }

  /* РЕДАКТОР */
  /* ИСПРАВЛЕНО: убрали жесткий flex, чтобы страница росла вниз */
  .scroll-container { 
    display: flex; 
    flex-direction: column; 
    width: 100%;
  }

  #capture-area {
    background-color: #121212;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    box-sizing: border-box;
  }

  #photo-preview {
    width: 280px; height: 280px;
    object-fit: cover; border-radius: 20px;
    background: #1a1a1a; border: 2px solid #333;
    margin-bottom: 20px; display: block;
  }

  #mobName {
    font-family: "Comic Sans MS", cursive;
    width: 100%; max-width: 400px;
    background: transparent; border: none;
    border-bottom: 2px solid #333; color: white;
    font-size: 24px; text-align: center;
    margin-bottom: 15px; padding: 8px; outline: none;
  }

  #mobDesc {
    font-family: "Comic Sans MS", cursive;
    width: 100%; max-width: 450px;
    background: #1a1a1a; border: 2px solid #333;
    border-radius: 15px; color: #ddd;
    padding: 15px; font-size: 16px;
    resize: none; outline: none;
    box-sizing: border-box; line-height: 1.4;
    min-height: 200px;
    /* ИСПРАВЛЕНО: textarea теперь не имеет внутреннего скролла, она расширяет страницу */
    overflow: hidden;
  }

  /* КНОПКИ */
  .controls { display: flex; justify-content: center; gap: 15px; padding: 20px; background: #121212; padding-bottom: 60px; }
  .btn {
    flex: 1; max-width: 170px; height: 60px;
    border-radius: 15px; border: 2px solid #444;
    font-family: "Comic Sans MS", cursive; font-size: 18px; font-weight: bold;
    cursor: pointer; background: #1a1a1a; color: #fff;
    text-transform: uppercase;
  }
  .btn:active { background: #333; }

  .mini-thumb { 
    width: 32px; height: 32px; border-radius: 6px; border: 1px solid #444; 
    object-fit: cover; margin-right: 12px; background: #333; 
  }
</style>
</head>
<body>

<div class="nav-header" id="navHeader">
  <div class="dropdown-btn" onclick="toggleMenu()">
    <span id="headerTitle">БЕСТИАРИЙ</span>
    <span>▼</span>
  </div>
  <div id="mob-list">
    <div id="items-anchor"></div>
    <div class="add-new-btn" onclick="createNewFile()">+ НОВАЯ ЗАПИСЬ</div>
  </div>
</div>

<div class="scroll-container">
    <div id="capture-area">
      <img id="photo-preview" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" onclick="document.getElementById('fileInput').click()">
      <input type="file" id="fileInput" accept="image/*" onchange="handleImage(event)" style="display:none">

      <input type="text" id="mobName" placeholder="НАИМЕНОВАНИЕ..." oninput="syncData()">
      <textarea id="mobDesc" placeholder="ХАРАКТЕРИСТИКА..." oninput="syncData(); autoResize(this)"></textarea>
    </div>

    <div class="controls">
      <button class="btn" onclick="saveAsImage()">СОХРАНИТЬ</button>
      <button class="btn" onclick="deleteFile()">УДАЛИТЬ</button>
    </div>
</div>

<script>
  let db = [];
  let currentIdx = 0;
  const DB_KEY = 'BESTIARY_ISOLATED_V13';
  const BLANK = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";

  window.onload = () => {
    const data = localStorage.getItem(DB_KEY);
    if (data) { db = JSON.parse(data); }
    if (!db || db.length === 0) { db = [{ name: "", desc: "", img: "" }]; }
    
    const savedIdx = localStorage.getItem('active_idx');
    currentIdx = (savedIdx && savedIdx < db.length) ? parseInt(savedIdx) : 0;
    
    render();
    buildMenu();
  };

  // ИСПРАВЛЕНО: Функция для авто-растягивания текстового поля
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  function render() {
    const file = db[currentIdx];
    document.getElementById('mobName').value = file.name || "";
    document.getElementById('mobDesc').value = file.desc || "";
    document.getElementById('photo-preview').src = file.img || BLANK;
    document.getElementById('headerTitle').textContent = file.name.trim() || "БЕСТИАРИЙ";
    localStorage.setItem('active_idx', currentIdx);
    autoResize(document.getElementById('mobDesc'));
  }

  function syncData() {
    db[currentIdx].name = document.getElementById('mobName').value;
    db[currentIdx].desc = document.getElementById('mobDesc').value;
    document.getElementById('headerTitle').textContent = db[currentIdx].name.trim() || "БЕСТИАРИЙ";
    localStorage.setItem(DB_KEY, JSON.stringify(db));
    buildMenu();
  }

  function buildMenu() {
    const anchor = document.getElementById('items-anchor');
    anchor.innerHTML = '';
    db.forEach((item, i) => {
      const div = document.createElement('div');
      div.className = 'mob-item';
      div.onclick = () => { currentIdx = i; render(); toggleMenu(); window.scrollTo(0,0); };
      const img = item.img || BLANK;
      div.innerHTML = `<img src="${img}" class="mini-thumb"> <span>${item.name || '(Пусто)'}</span>`;
      anchor.appendChild(div);
    });
  }

  function handleImage(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const max = 600;
        let w = img.width, h = img.height;
        if (w > h) { if (w > max) { h *= max/w; w = max; } }
        else { if (h > max) { w *= max/h; h = max; } }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        db[currentIdx].img = canvas.toDataURL('image/jpeg', 0.7);
        document.getElementById('photo-preview').src = db[currentIdx].img;
        syncData();
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  }

  function createNewFile() {
    db.push({ name: "", desc: "", img: "" });
    currentIdx = db.length - 1;
    localStorage.setItem(DB_KEY, JSON.stringify(db));
    render();
    buildMenu();
    if(document.getElementById('navHeader').classList.contains('open')) toggleMenu();
    window.scrollTo(0,0);
  }

  function deleteFile() {
    if (confirm("УДАЛИТЬ ЭТОТ ФАЙЛ?")) {
      db.splice(currentIdx, 1);
      if (db.length === 0) db = [{ name: "", desc: "", img: "" }];
      currentIdx = 0;
      localStorage.setItem(DB_KEY, JSON.stringify(db));
      render();
      buildMenu();
    }
  }

  function toggleMenu() { document.getElementById('navHeader').classList.toggle('open'); }

  async function saveAsImage() {
    const area = document.getElementById('capture-area');
    html2canvas(area, { backgroundColor: "#121212", scale: 2 }).then(canvas => {
      const link = document.createElement('a');
      link.download = `${db[currentIdx].name || 'creature'}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    });
  }
</script>
</body>
</html>
