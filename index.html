<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Bestiary Scroll Fixed</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  /* Максимально открываем скролл */
  html {
    overflow-y: auto !important;
    height: auto !important;
  }
  
  body {
    margin: 0;
    padding: 0;
    background-color: #121212;
    color: #ffffff;
    font-family: "Comic Sans MS", cursive, sans-serif;
    /* Принудительный вертикальный скролл для сенсоров */
    touch-action: pan-y !important;
    -webkit-overflow-scrolling: touch;
    min-height: 101vh; /* Чуть больше экрана, чтобы скролл был всегда активен */
  }

  /* Навигация */
  .nav-header {
    background: #1a1a1a;
    border-bottom: 2px solid #333;
    position: sticky;
    top: 0;
    z-index: 9999;
  }

  .dropdown-btn {
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: bold;
    cursor: pointer;
  }

  #mob-list {
    display: none;
    max-height: 300px;
    overflow-y: auto;
    background: #1a1a1a;
  }
  .open #mob-list { display: block; }

  .mob-item {
    padding: 15px;
    border-top: 1px solid #333;
    display: flex;
    align-items: center;
  }

  .add-new-btn {
    padding: 15px;
    text-align: center;
    background: #222;
    font-weight: bold;
    color: #00ff00;
  }

  /* Редактор */
  .editor-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 0;
  }

  #capture-area {
    background: #121212;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  #photo-preview {
    width: 300px;
    height: 300px;
    object-fit: cover;
    border-radius: 20px;
    border: 3px solid #333;
    background: #1a1a1a;
    margin-bottom: 20px;
  }

  #mobName {
    width: 85%;
    background: transparent;
    border: none;
    border-bottom: 2px solid #444;
    color: white;
    font-size: 24px;
    text-align: center;
    margin-bottom: 20px;
    padding: 10px;
    outline: none;
  }

  #mobDesc {
    width: 85%;
    background: #1a1a1a;
    border: 2px solid #333;
    border-radius: 15px;
    color: #ddd;
    padding: 15px;
    font-size: 16px;
    line-height: 1.5;
    min-height: 200px;
    resize: none;
    outline: none;
    overflow: hidden; /* Будет расширяться скриптом */
  }

  /* Кнопки */
  .controls {
    width: 90%;
    margin-top: 30px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding-bottom: 50px;
  }

  .btn {
    padding: 20px 10px;
    border-radius: 15px;
    border: 2px solid #444;
    background: #1a1a1a;
    color: white;
    font-weight: bold;
    text-transform: uppercase;
  }

  .btn-refresh {
    grid-column: span 2;
    background: #222;
    color: #aaa;
    font-size: 12px;
    border: 1px dashed #444;
  }

  .mini-thumb { width: 35px; height: 35px; border-radius: 5px; margin-right: 15px; }
</style>
</head>
<body>

<div class="nav-header">
  <div class="dropdown-btn" onclick="toggleMenu()">
    <span id="titleLabel">БЕСТИАРИЙ</span>
    <span>▼</span>
  </div>
  <div id="mob-list">
    <div id="list-items"></div>
    <div class="add-new-btn" onclick="addNew()">+ СОЗДАТЬ НОВЫЙ ФАЙЛ</div>
  </div>
</div>

<div class="editor-container">
  <div id="capture-area">
    <img id="photo-preview" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" onclick="document.getElementById('fileIn').click()">
    <input type="file" id="fileIn" accept="image/*" style="display:none" onchange="upload(event)">

    <input type="text" id="mobName" placeholder="ИМЯ..." oninput="autoSave()">
    <textarea id="mobDesc" placeholder="ОПИСАНИЕ..." oninput="autoSave(); resize(this)"></textarea>
  </div>

  <div class="controls">
    <button class="btn" onclick="download()">СКАЧАТЬ PNG</button>
    <button class="btn" onclick="remove()">УДАЛИТЬ ФАЙЛ</button>
    <button class="btn btn-refresh" onclick="location.reload()">ОБНОВИТЬ СТРАНИЦУ ↻</button>
  </div>
</div>

<script>
  let storage = [];
  let currentId = 0;
  const DB_NAME = 'BESTIARY_REVOLUTION_V16';
  const EMPTY = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";

  window.onload = () => {
    const saved = localStorage.getItem(DB_NAME);
    if (saved) storage = JSON.parse(saved);
    if (storage.length === 0) storage = [{name: "", desc: "", img: ""}];
    
    currentId = parseInt(localStorage.getItem('active_id') || 0);
    if (currentId >= storage.length) currentId = 0;
    
    load();
    renderMenu();
  };

  function resize(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  function load() {
    const item = storage[currentId];
    document.getElementById('mobName').value = item.name || "";
    document.getElementById('mobDesc').value = item.desc || "";
    document.getElementById('photo-preview').src = item.img || EMPTY;
    document.getElementById('titleLabel').textContent = item.name || "БЕСТИАРИЙ";
    resize(document.getElementById('mobDesc'));
  }

  function autoSave() {
    storage[currentId].name = document.getElementById('mobName').value;
    storage[currentId].desc = document.getElementById('mobDesc').value;
    document.getElementById('titleLabel').textContent = storage[currentId].name || "БЕСТИАРИЙ";
    localStorage.setItem(DB_NAME, JSON.stringify(storage));
    localStorage.setItem('active_id', currentId);
    renderMenu();
  }

  function renderMenu() {
    const container = document.getElementById('list-items');
    container.innerHTML = '';
    storage.forEach((item, i) => {
      const div = document.createElement('div');
      div.className = 'mob-item';
      div.onclick = () => { currentId = i; load(); toggleMenu(); window.scrollTo(0,0); };
      div.innerHTML = `<img src="${item.img || EMPTY}" class="mini-thumb"> <span>${item.name || '---'}</span>`;
      container.appendChild(div);
    });
  }

  function upload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const max = 600;
        let w = img.width, h = img.height;
        if (w > h) { if (w > max) { h *= max/w; w = max; } }
        else { if (h > max) { w *= max/h; h = max; } }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        storage[currentId].img = canvas.toDataURL('image/jpeg', 0.6);
        document.getElementById('photo-preview').src = storage[currentId].img;
        autoSave();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function addNew() {
    storage.push({name: "", desc: "", img: ""});
    currentId = storage.length - 1;
    autoSave();
    load();
    toggleMenu();
  }

  function remove() {
    if (confirm("УДАЛИТЬ ЭТОТ ФАЙЛ?")) {
      storage.splice(currentId, 1);
      if (storage.length === 0) storage = [{name: "", desc: "", img: ""}];
      currentId = 0;
      autoSave();
      load();
    }
  }

  function toggleMenu() { document.querySelector('#mob-list').style.display = 
    document.querySelector('#mob-list').style.display === 'block' ? 'none' : 'block'; }

  function download() {
    const area = document.getElementById('capture-area');
    html2canvas(area, { backgroundColor: "#121212", scale: 2 }).then(canvas => {
      const link = document.createElement('a');
      link.download = 'creature.png';
      link.href = canvas.toDataURL();
      link.click();
    });
  }
</script>
</body>
</html>
